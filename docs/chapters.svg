<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Atlas of Drifting Isles</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#fbf2e4"/><path d="M40 40H1160M40 347H1160" stroke="#7cc4ff" stroke-opacity=".8"/><path d="M320 40V347" stroke="#7cc4ff" stroke-opacity=".55"/><text x="55" y="67" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#ef7d5c" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#7cc4ff" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#ef7d5c" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#ef7d5c"/> --><text x="180" y="191" text-anchor="middle" fill="#ef7d5c" font-family="Georgia,serif" font-size="54" font-style="italic">L</text><text x="55" y="281" fill="#1d2742" font-family="Georgia,serif" font-style="italic" font-size="22">Lanternholm</text><text x="55" y="307" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11">A warm light in the cloud sea.</text><path d="M600 40V347" stroke="#7cc4ff" stroke-opacity=".55"/><text x="335" y="67" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#ef7d5c" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#7cc4ff" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#ef7d5c" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#ef7d5c"/> --><text x="460" y="191" text-anchor="middle" fill="#ef7d5c" font-family="Georgia,serif" font-size="54" font-style="italic">A</text><text x="335" y="281" fill="#1d2742" font-family="Georgia,serif" font-style="italic" font-size="22">Amberlea</text><text x="335" y="307" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11">An island touched by late sun.</text><path d="M880 40V347" stroke="#7cc4ff" stroke-opacity=".55"/><text x="615" y="67" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#ef7d5c" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#7cc4ff" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#ef7d5c" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#ef7d5c"/> --><text x="740" y="191" text-anchor="middle" fill="#ef7d5c" font-family="Georgia,serif" font-size="54" font-style="italic">H</text><text x="615" y="281" fill="#1d2742" font-family="Georgia,serif" font-style="italic" font-size="22">Hollowmere</text><text x="615" y="307" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11">A quiet refuge above the mist.</text><path d="M1160 40V347" stroke="#7cc4ff" stroke-opacity=".55"/><text x="895" y="67" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#ef7d5c" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#7cc4ff" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#ef7d5c" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#ef7d5c"/> --><text x="1020" y="191" text-anchor="middle" fill="#ef7d5c" font-family="Georgia,serif" font-size="54" font-style="italic">H</text><text x="895" y="281" fill="#1d2742" font-family="Georgia,serif" font-style="italic" font-size="22">Hanakumo</text><text x="895" y="307" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11">The farthest stop on the</text><text x="895" y="325" fill="#7cc4ff" font-family="Arial,sans-serif" font-size="11">route.</text></svg>